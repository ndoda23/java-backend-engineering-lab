spring.application.name=ticket-booking-system

# PostgreSQL (local)
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketbooking
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate only validates
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable RabbitMQ auto-config until messaging is implemented
spring.autoconfigure.exclude=\
  org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration

# JWT
app.jwt.secret=change-me-to-a-long-random-secret-at-least-256-bits-long-key
app.jwt.expiration-ms=86400000
